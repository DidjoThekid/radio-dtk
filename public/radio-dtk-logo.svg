<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" aria-labelledby="title desc" role="img">
  <title id="title">Radio DTK</title>
  <desc id="desc">Logo Radio DTK inspiré du mockup avec texte RADIO blanc, DTK rouge et étoile rouge.</desc>
  <rect width="1600" height="980" fill="#000000"/>

  <g transform="translate(60 50)">
    <path d="M60 190 H1500 V655 H60 Z" fill="none" stroke="#ff1f1f" stroke-width="16"/>
    <path d="M70 205 H1490 V640 H70 Z" fill="none" stroke="#d7d7d7" stroke-width="4" opacity="0.7"/>

    <g font-family="Impact, Arial Black, sans-serif" font-weight="900" letter-spacing="-10">
      <text x="112" y="430" font-size="290" fill="#f2f2f2">RADIO</text>
      <text x="228" y="700" font-size="310" fill="#ff1f1f" transform="skewX(-9)">DTK</text>
    </g>

    <g transform="translate(1160 15)">
      <path d="M0,-220 L54,-42 L232,-42 L82,28 L130,210 L0,94 L-130,210 L-82,28 L-232,-42 L-54,-42 Z" fill="#ff1f1f" stroke="#f7f7f7" stroke-width="18"/>
      <path d="M0,-183 L42,-42 L196,-42 L68,20 L102,168 L0,82 L-102,168 L-68,20 L-196,-42 L-42,-42 Z" fill="#ff1f1f"/>
      <path d="M0,-145 L24,-44 L128,-44 L36,8 L62,118 L0,60 L-62,118 L-36,8 L-128,-44 L-24,-44 Z" fill="#ff1f1f" opacity="0.18"/>
    </g>

    <g transform="translate(180 750)" font-family="Impact, Arial Black, sans-serif" font-weight="900" letter-spacing="3">
      <rect x="0" y="0" width="1185" height="110" fill="#f3f3f3" opacity="0.1"/>
      <rect x="24" y="22" width="1137" height="72" fill="none" stroke="#f2f2f2" stroke-width="4" opacity="0.75"/>
      <g fill="#f2f2f2" font-size="90">
        <text x="170" y="78">TA RADIO, TA VIBE</text>
      </g>
    </g>
  </g>
</svg>
