<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radio DTK</title>
  <style>
    :root{--bg:#0b0b1a;--card:#15152b;--blue:#1e90ff;--pink:#ff2d95;--txt:#f2f2fa;--mut:#9a9ab8}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:100px}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:linear-gradient(90deg,var(--blue),var(--pink))}
    .logo{display:flex;align-items:center;min-height:52px}
    .brand-logo{display:block;height:56px;width:auto;max-width:min(60vw,480px)}
    .brand-logo--small{height:52px}
    .live{background:linear-gradient(135deg,#8b0e63,#4a0a44);color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);box-shadow:0 2px 0 rgba(0,0,0,.2)}
    .live i{width:14px;height:14px;display:block;border-radius:3px;background:linear-gradient(to right,transparent 0 10%,#fff 10% 18%,transparent 18% 28%,#fff 28% 36%,transparent 36% 46%,#fff 46% 54%,transparent 54% 64%,#fff 64% 72%,transparent 72% 82%,#fff 82% 90%,transparent 90% 100%)}
    @keyframes p{50%{opacity:.2}} 
    .ticker{background:#000;color:#ffe14d;overflow:hidden;white-space:nowrap;font-weight:700;font-size:14px;padding:8px 0}
    .ticker span{display:inline-block;padding-left:100%;animation:t 30s linear infinite}
    @keyframes t{to{transform:translateX(-100%)}}
    main{max-width:980px;margin:0 auto;padding:20px 16px}
    .hero{background:linear-gradient(135deg,#1b1b44,#2a1450);border-radius:18px;padding:28px 20px;text-align:center}
    .hero small,.bar small{color:var(--mut);letter-spacing:2px;font-size:11px}
    .hero h1{margin:8px 0 18px;font-size:clamp(22px,5vw,38px)}
    .btn{font:inherit;font-weight:800;font-size:20px;padding:14px 34px;border:0;border-radius:99px;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--blue),var(--pink))}
    .bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:12px 16px;background:#000d;backdrop-filter:blur(8px);border-top:1px solid #ffffff22}
    #pp{width:48px;height:48px;border-radius:50%;border:0;font-size:20px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--pink))}
  </style>
</head>
<script src="/cover-live.js"></script>
<body>
  <header>
    <div class="logo"><img src="/radio-dtk-logo.svg" alt="Radio DTK" class="brand-logo brand-logo--small"></div>
    <div class="live"><i></i>EN DIRECT</div>
  </header>

  <main>
    <div class="hero">
      <h1>Radio DTK</h1>
      <button class="btn">▶ Écouter</button>
    </div>
  </main>

  <div class="bar">
    <button id="pp">▶</button>
    <div><small>RADIO DTK</small><div>Prêt à écouter</div></div>
  </div>
</body>
</html>
<section id="telechargements" style="text-align:center;margin:30px 0">
  <h2>📲 Télécharger l'app</h2>
  <div id="dl-liste" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <a class="dl" data-os="windows" href="https://github.com/DidjoThekid/radio-dtk/releases/latest/download/Radio_DTK_Setup.exe">🪟 Windows</a>
    <a class="dl" data-os="mac" href="https://github.com/DidjoThekid/radio-dtk/releases/latest/download/Radio_DTK_Mac.dmg">🍎 Mac (M1, M2, M3…)</a>
    <a class="dl" data-os="android" href="https://github.com/DidjoThekid/radio-dtk/releases/latest/download/Radio_DTK.apk">🤖 Android</a>
  </div>
  <p id="dl-ios" style="display:none;margin-top:12px">
    🍏 iPhone : ouvre ce site dans Safari, appuie sur Partager puis « Sur l'écran d'accueil ».
  </p>
</section>
<style>
  .dl{padding:12px 20px;border-radius:10px;background:#222;color:#fff;text-decoration:none;font-weight:700}
  .dl.top{background:#e11d48;order:-1}
</style>
<script>
(function () {
  var ua = navigator.userAgent, os = '';
  if (/Android/i.test(ua)) os = 'android';
  else if (/iPhone|iPad|iPod/i.test(ua)) { document.getElementById('dl-ios').style.display = 'block'; }
  else if (/Mac/i.test(ua)) os = 'mac';
  else if (/Windows/i.test(ua)) os = 'windows';
  var el = document.querySelector('.dl[data-os="' + os + '"]');
  if (el) el.classList.add('top');
})();
</script>
